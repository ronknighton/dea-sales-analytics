name: Deploy Extraction Layer (AWS)

on:
  push:
    branches: [main]
    paths:
      - 'lambda/**'
      - 'infrastructure/**'
      - '.github/workflows/deploy-aws.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lambda/**'
      - 'infrastructure/**'

permissions:
  id-token: write   # required for OIDC — no static AWS credentials used
  contents: read

env:
  AWS_REGION: us-east-1
  STACK_NAME: sales-analytics-pipeline-extraction

jobs:
  validate:
    # Runs on every PR — validates the template without deploying anything.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/sales-analytics-pipeline-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://infrastructure/template.yaml

      - name: Lint Lambda code
        run: |
          pip install pyflakes
          pyflakes lambda/extract_handler.py

  deploy:
    # Runs only on merge to main — validate-on-PR, deploy-on-merge pattern.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/sales-analytics-pipeline-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/template.yaml \
            --stack-name ${{ env.STACK_NAME }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              DBHost="${{ secrets.DB_HOST }}" \
              DBName="dea_analytics_dev" \
              DBUser="student_user" \
              DBPassword="${{ secrets.DB_PASSWORD }}" \
              S3BucketName="${{ secrets.S3_BUCKET_NAME }}" \
              AlertEmail="${{ secrets.ALERT_EMAIL }}" \
              ExistingGitHubOIDCProviderArn="arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:oidc-provider/token.actions.githubusercontent.com" \
            --no-fail-on-empty-changeset

      - name: Package Lambda code
        run: |
          cd lambda
          pip install -r requirements.txt -t . --platform manylinux2014_x86_64 --only-binary=:all: --python-version 3.12
          zip -r ../function.zip .

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name sales-analytics-pipeline-extraction \
            --zip-file fileb://function.zip

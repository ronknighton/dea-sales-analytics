name: Deploy Snowflake Layer

on:
  push:
    branches: [main]
    paths:
      - 'workflow/snowflake/bronze/**'
      - 'workflow/snowflake/silver/**'
      - 'workflow/snowflake/gold/**'
      - 'workflow/streamlit/**'
      - '.github/workflows/deploy-snowflake.yml'
  pull_request:
    branches: [main]
    paths:
      - 'workflow/snowflake/bronze/**'
      - 'workflow/snowflake/silver/**'
      - 'workflow/snowflake/gold/**'
      - 'workflow/streamlit/**'

permissions:
  id-token: write   # required for Snowflake OIDC/WIF — no static credentials used
  contents: read

env:
  SNOWFLAKE_ACCOUNT: kttaypt-bt25293
  SNOWFLAKE_USER: SVC_GITHUB_SALES_ANALYTICS
  SNOWFLAKE_ROLE: SALES_ANALYTICS_DEPLOY_ROLE
  SNOWFLAKE_WAREHOUSE: SALES_ANALYTICS_WH
  SNOWFLAKE_DATABASE: SALES_ANALYTICS_PIPELINE

jobs:
  validate:
    # PR-only: lightweight sanity checks that don't require Snowflake
    # authentication. Deliberately does NOT attempt to connect to
    # Snowflake here: pull_request-triggered workflows get a different
    # OIDC subject claim (repo:OWNER@ID/REPO@ID:pull_request) than the
    # push-to-main claim the service user's SUBJECT is scoped to
    # (repo:OWNER@ID/REPO@ID:ref:refs/heads/main) — Snowflake WIF requires
    # an exact match with no wildcard, so a connection attempt here would
    # simply fail auth every time rather than validate anything.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflow/snowflake
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install sqlparse
        run: pip install sqlparse --break-system-packages -q

      - name: Write SQL syntax checker
        run: |
          cat > check_sql.py << 'PYEOF'
          import sys
          import sqlparse

          def check(path):
              with open(path) as f:
                  content = f.read()
              try:
                  statements = sqlparse.parse(content)
              except Exception as e:
                  print(f"  FAILED: sqlparse could not parse file: {e}")
                  return False
              if not statements:
                  print("  FAILED: no statements found")
                  return False
              # sqlparse correctly tokenizes string literals (including ''
              # escapes) and comments, avoiding false positives a hand-rolled
              # quote-tracker hits on legitimate SQL (activity names like
              # '5) Strategy Call' containing parens, comment apostrophes
              # like "doc's", or escaped '' apostrophes inside string bodies).
              depth = 0
              ok = True
              for stmt in statements:
                  for token in stmt.flatten():
                      if token.ttype is sqlparse.tokens.Punctuation:
                          if token.value == '(':
                              depth += 1
                          elif token.value == ')':
                              depth -= 1
                              if depth < 0:
                                  print(f"  FAILED: unmatched closing paren near '{token}'")
                                  ok = False
                                  depth = 0
              if depth != 0:
                  print(f"  FAILED: {depth} unclosed paren(s) at end of file")
                  ok = False
              if ok:
                  print("  OK")
              return ok

          all_ok = True
          for path in sys.argv[1:]:
              print(f"Checking {path}")
              if not check(path):
                  all_ok = False
          sys.exit(0 if all_ok else 1)
          PYEOF

      - name: Basic SQL syntax sanity check
        run: python3 check_sql.py bronze/*.sql silver/*.sql gold/*.sql

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflow/snowflake
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Snowflake CLI with OIDC
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: '3.20.0'

      # Deploy order matters: schema before Tasks, since Tasks reference
      # objects (UDF, tables) that must already exist.
      - name: Deploy Bronze schema
        run: snow sql -f bronze/001_bronze_schema.sql --temporary-connection

      - name: Deploy Silver repair UDF
        run: snow sql -f silver/001_repair_udf.sql --temporary-connection

      - name: Deploy Silver schema
        run: snow sql -f silver/002_silver_schema.sql --temporary-connection

      - name: Deploy Tasks and monitoring
        run: snow sql -f silver/003_tasks_and_monitoring.sql --temporary-connection

      - name: Deploy Gold dimension and fact
        run: snow sql -f gold/001_gold_dimension_fact.sql --temporary-connection

      - name: Deploy Gold KPI views
        run: snow sql -f gold/002_kpi_views.sql --temporary-connection

      - name: Deploy Gold report views
        run: snow sql -f gold/003_report_views.sql --temporary-connection

      - name: Deploy Streamlit dashboard
        working-directory: workflow/streamlit
        run: >
          snow streamlit deploy --replace --temporary-connection
          --database SALES_ANALYTICS_PIPELINE --schema GOLD